pre-commit:
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bunx biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: lint
      run: bun run lint
    - name: typecheck
      run: bun run typecheck

pre-push:
  jobs:
    - name: lint
      run: bun run lint
    - name: build
      run: bun run build
